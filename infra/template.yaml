AWSTemplateFormatVersion: '2010-09-09'
Description: Feedback form backend - Lambda endpoint that stores feedback as Parquet in S3

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  AllowedOrigin:
    Type: String
    Default: http://localhost:5173
    Description: Frontend origin allowed by CORS (scheme + host, no trailing slash). Never use '*'.
  FeedbackObjectKey:
    Type: String
    Default: feedback/feedback.parquet
    AllowedPattern: ^feedback/[A-Za-z0-9._/-]+\.parquet$
    Description: S3 key of the Parquet file the Lambda creates/updates (passed to it as OBJECT_KEY).
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Resources:
  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub feedback-form-${Environment}-${AWS::AccountId}-${AWS::Region}
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireNoncurrentVersions
            Status: Enabled
            NoncurrentVersionExpiration:
              NoncurrentDays: 30

  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub ${DataBucket.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: false

  FunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/feedback-form-${Environment}
      RetentionInDays: !Ref LogRetentionDays

  FunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WriteFeedback
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                Resource: !Sub ${DataBucket.Arn}/feedback/*
              # Without ListBucket, S3 answers 403 instead of 404 for a missing
              # key, so the Lambda could not tell "create" from "denied".
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: feedback/*
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !GetAtt FunctionLogGroup.Arn

  FeedbackFunction:
    Type: AWS::Lambda::Function
    DependsOn: FunctionLogGroup
    Metadata:
      cfn-lint:
        config:
          ignore_checks: [W3002] # local Code path is resolved by `aws cloudformation package`
    Properties:
      FunctionName: !Sub feedback-form-${Environment}
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt FunctionRole.Arn
      MemorySize: 256
      Timeout: 10
      # Replaced with an S3 location by `aws cloudformation package` (see scripts/deploy.sh).
      Code: ../backend/dist
      Environment:
        Variables:
          BUCKET_NAME: !Ref DataBucket
          OBJECT_KEY: !Ref FeedbackObjectKey

  FunctionUrl:
    Type: AWS::Lambda::Url
    Properties:
      TargetFunctionArn: !GetAtt FeedbackFunction.Arn
      AuthType: NONE
      Cors:
        AllowOrigins: [!Ref AllowedOrigin]
        AllowMethods: [POST]
        AllowHeaders: [content-type]
        MaxAge: 86400

  FunctionUrlInvokeUrlPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FeedbackFunction
      Action: lambda:InvokeFunctionUrl
      Principal: '*'
      FunctionUrlAuthType: NONE

  FunctionUrlInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FeedbackFunction
      Action: lambda:InvokeFunction
      Principal: '*'
      InvokedViaFunctionUrl: true

Outputs:
  ApiUrl:
    Description: Value for apiUrl in the frontend's config.json
    Value: !GetAtt FunctionUrl.FunctionUrl
  BucketName:
    Value: !Ref DataBucket
  FunctionName:
    Value: !Ref FeedbackFunction
